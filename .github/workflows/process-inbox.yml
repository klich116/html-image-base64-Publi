name: procesar inbox

# Este workflow es el que hace que "subir un HTML a la carpeta inbox/"
# sea suficiente para probarlo, sin que nadie tenga que correr nada a
# mano. Se dispara solo cuando cambia algo dentro de inbox/, corre el
# conversor sobre esa carpeta, y deja el resultado en inbox_output/
# con un commit automático. También lo dejo disponible por si alguien
# quiere lanzarlo manualmente desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr el conversor sobre inbox/
        run: |
          # Empiezo borrando la salida anterior: si alguien quita un
          # HTML de inbox/, no quiero que su resultado viejo se quede
          # como basura huérfana en inbox_output/.
          rm -rf inbox_output
          mkdir -p inbox_output
          touch inbox_output/.gitkeep
          # El CLI devuelve código 1 si alguna imagen falló, lo cual
          # tiene sentido para un pipeline estricto, pero acá en inbox/
          # un fallo parcial es justo lo que quiero poder ver en el
          # reporte, no algo que deba tumbar el job entero. Por eso
          # dejo pasar ese código con "|| true".
          PYTHONPATH=src python -m html_image_base64 inbox \
            --out inbox_output \
            --report inbox_output/report.json \
            --dashboard inbox_output/dashboard.html \
            -v || true

      - name: Publicar el resultado de vuelta al repo
        run: |
          git config user.name "html-image-base64-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inbox_output
          if git diff --cached --quiet; then
            echo "No hay imágenes nuevas que procesar, no creo commit."
          else
            git commit -m "bot: proceso automático de inbox/ [skip ci]"
            git push
          fi
