name: tests

# Corro los 25 tests en cada push, así puedo ver directo en la pestaña
# "Actions" del repo si algo se rompió, sin tener que acordarme de
# correrlos yo mismo en local antes de subir cambios.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Generar demo (dashboard + reporte)
        run: |
          PYTHONPATH=src python -m html_image_base64 sample_data \
            --out demo_output/converted \
            --report demo_output/report.json \
            --dashboard demo_output/dashboard.html
